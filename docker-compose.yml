services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: estatepilot
      POSTGRES_PASSWORD: change-me-local-only
      POSTGRES_DB: estatepilot
    volumes: [pgdata:/var/lib/postgresql/data]
    profiles: [postgres]
  backend:
    build: ./backend
    env_file: [./backend/.env.example]
    environment:
      DATABASE_URL: sqlite:////data/estatepilot.db
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      FRONTEND_URL: http://localhost:3000
    volumes: [appdata:/data]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args: { VITE_API_URL: http://localhost:8000/api/v1 }
    ports: ["3000:80"]
    depends_on: [backend]
volumes: { pgdata: {}, appdata: {} }
